[project]
name = "promptguard"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.1",
  "pyyaml==6.0.3",
]

[tool.vercel]
# Vercel detects the FastAPI instance named `app` in this module.
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
